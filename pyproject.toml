[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aducat-val"
version = "0.1.0"
description = "Shared readers and metrics for the ADUCAT InSAR validation notebooks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "shapely>=2",
    "geopandas",
    "pyproj",
    "scipy",
    "matplotlib",
    "ipython",
]

[tool.setuptools.packages.find]
where = ["src"]
